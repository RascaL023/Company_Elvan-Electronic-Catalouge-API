name: CI

on:
  push:
    branches: [main, deploy-test]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # PostgreSQL nyata untuk test integrasi (issue #5). DSN-nya diekspos lewat
    # TEST_DATABASE_URL di level job supaya `go test ./...` menjalankan test
    # integrasi, bukan di-skip.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: elvan
          POSTGRES_PASSWORD: elvan
          POSTGRES_DB: elvan_catalog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elvan -d elvan_catalog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://elvan:elvan@localhost:5432/elvan_catalog_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          "$(go env GOPATH)/bin/golangci-lint" run

      # Kode sqlcgen adalah hasil generate dari db/queries — kalau query diubah
      # tanpa `make sqlc`, gate ini merah (docs/DEVELOPER_GUIDE.md §Alur kerja).
      # sqlc membaca skema dari db/migrations, jadi tidak butuh koneksi DB.
      - name: sqlc (setup v1.31.1)
        uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: '1.31.1'

      - name: sqlc diff (kode generate harus sinkron)
        run: sqlc diff

      - name: migrate (goose)
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.28.0
          "$(go env GOPATH)/bin/goose" -dir db/migrations postgres "$TEST_DATABASE_URL" up

      - name: go test (unit + integrasi Postgres)
        run: go test ./...

      - name: go build
        run: go build ./...

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Versi CLI dipin supaya pemeriksaan kontrak tidak berubah sendiri saat
      # rilis baru @redocly/cli keluar.
      - name: lint OpenAPI
        run: npx --yes @redocly/cli@2.64.0 lint api/openapi.yaml

  # Artefak rilis. Dijalankan HANYA setelah `verify` hijau dan hanya dari
  # `main` — PR dan `deploy-test` tidak mempublikasikan image. Job ini tidak
  # menyentuh VPS; yang men-deploy adalah .github/workflows/deploy.yml
  # (manual + persetujuan environment `production`).
  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: api
            name: elvan-api
          - target: migrate
            name: elvan-api-migrate
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR menolak nama dengan huruf besar; owner GitHub boleh punya.
      - name: Normalisasi nama image
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/$owner/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      # `sha-<commit>` adalah tag yang dipakai deploy (dan rollback); `latest`
      # sekadar penunjuk build terakhir di main.
      - name: Build & push (${{ matrix.target }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          # Scope per target: cache `api` dan `migrate` tidak saling menimpa.
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
