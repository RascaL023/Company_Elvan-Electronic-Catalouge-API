# compose.yaml — topologi produksi satu VPS (ARCHITECTURE §15).
#
#   Internet ──▶ caddy (TLS otomatis)
#                  ├── /         → web (:80, nginx + dist FE)
#                  ├── /api/*    → api (:8080) ──▶ postgres:18
#                  └── /healthz  → api
#
# FE dan API adalah DUA image terpisah dari DUA repo (multi-repo):
#   elvan-api  dibangun dari repo ini      (deploy/Dockerfile, target api)
#   elvan-web  dibangun dari repo FE       (deploy/Dockerfile di repo FE)
# VPS tidak pernah install Node/pnpm/Go — cukup `docker compose pull`.
#
# Migrasi adalah langkah TERPISAH sebelum API naik (bukan saat startup):
#
#   docker compose up -d postgres
#   docker compose run --rm migrate        # goose up
#   docker compose up -d api web caddy
#
# Image API dibangun dari root repo ini:
#   docker compose build
# atau:
#   docker build -f deploy/Dockerfile -t elvan-api:dev .
#
# Konfigurasi lewat env (satu berkas): salin deploy/.env.example ke deploy/.env.

name: elvan

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elvan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}
      POSTGRES_DB: ${POSTGRES_DB:-elvan_catalog}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-elvan} -d ${POSTGRES_DB:-elvan_catalog}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Langkah migrasi terpisah (goose up). Tidak restart otomatis; jalankan
  # eksplisit sebelum api, sesuai ARCHITECTURE §15.
  migrate:
    # Dua cara pakai: `build` untuk lokal (`--build`), `image` untuk VPS
    # (`pull` dari GHCR, dipakai dengan `--no-build`). `image` diisi
    # MIGRATE_IMAGE oleh .github/workflows/deploy.yml.
    image: ${MIGRATE_IMAGE:-elvan-api-migrate:dev}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: migrate
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOOSE_DBSTRING: "host=postgres port=5432 user=${POSTGRES_USER:-elvan} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB:-elvan_catalog} sslmode=disable"

  api:
    # Lihat catatan di `migrate`: image untuk VPS, build untuk lokal.
    image: ${API_IMAGE:-elvan-api:dev}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # production (default) | development; lihat catatan di .env.example:
      # config API menolak COOKIE_SECURE=false saat APP_ENV=production.
      APP_ENV: ${APP_ENV:-production}
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: "host=postgres port=5432 user=${POSTGRES_USER:-elvan} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB:-elvan_catalog} sslmode=disable"
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:-10s}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-30s}
      SESSION_TTL: ${SESSION_TTL:-168h}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-5/min}
      IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY:-}
      IMAGEKIT_URL_ENDPOINT: ${IMAGEKIT_URL_ENDPOINT:-}
    expose:
      - "8080"

  # Situs statis FE. Image dibangun dari repo FE (deploy/Dockerfile) atau
  # di-pull dari registry; compose hanya menunjuk tag-nya lewat WEB_IMAGE.
  # Tanpa `build:` dan tanpa port host: hanya Caddy yang bisa menjangkaunya.
  web:
    image: ${WEB_IMAGE:-elvan-web:dev}
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      SITE_EMAIL: ${SITE_EMAIL:-}
      API_ORIGIN: api:8080
      WEB_ORIGIN: web:80
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
