openapi: 3.1.0

info:
  title: Elvan Catalog API
  version: 0.1.0
  license:
    name: Proprietary
  description: |
    Kontrak API katalog elektronik Elvan Electronic. Dokumen ini adalah sumber
    kebenaran kontrak antara backend (Go) dan frontend (React).

    Cakupan versi ini (Fase 5): **jalur baca publik** + **auth admin** +
    **endpoint tulis** produk/kategori/brand + **modul media** (tanda tangan
    upload & hapus berkas).

    Konvensi:
    - JSON `camelCase`, waktu ISO-8601 UTC dengan milidetik (`.000Z`),
      sama dengan `Date.prototype.toISOString()` di FE.
    - Gambar disimpan sebagai **relative key** (tanpa slash di depan); FE yang
      memetakannya ke URL CDN.
    - `category` dan `brand` adalah **slug**, bukan id.
    - `images` berbentuk array objek `{ key, fileId }`. Adapter FE memetakannya
      ke kontrak domainnya (`images: string[]` + `imageFileIds: string[]`).
    - Endpoint baca memakai `ETag` + `Cache-Control: public, max-age=60` dan
      mendukung `If-None-Match` → `304 Not Modified`.

servers:
  - url: /
    description: Satu domain, API di /api lewat reverse proxy (rencana produksi)
  - url: http://localhost:8080
    description: Development lokal

# Default publik: endpoint baca tidak memerlukan kredensial. Endpoint admin
# (auth `me`, serta semua operasi tulis) menambahkan `security: [{cookieAuth: []}]`
# pada operasinya masing-masing.
security: []

tags:
  - name: Health
    description: Liveness dan readiness
  - name: Catalog
    description: Proyeksi katalog untuk listing publik
  - name: Products
    description: Produk
  - name: Categories
    description: Kategori
  - name: Brands
    description: Brand
  - name: Auth
    description: Sesi admin (login, logout, sesi saat ini)
  - name: Media
    description: Tanda tangan upload ImageKit & penghapusan berkas

paths:
  /healthz:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Liveness probe
      description: Mengembalikan 200 selama proses hidup. Tidak menyentuh database.
      responses:
        '200':
          description: Proses hidup
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /readyz:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Readiness probe
      description: Mem-ping PostgreSQL. Mengembalikan 503 bila database tidak dapat dihubungi.
      responses:
        '200':
          description: Siap menerima trafik
          content:
            text/plain:
              schema:
                type: string
                example: ok
        '503':
          description: Belum siap (mis. database tidak dapat dihubungi)
          content:
            text/plain:
              schema:
                type: string
                example: unavailable

  /api/v1/catalog:
    get:
      tags: [Catalog]
      operationId: getCatalog
      summary: Seluruh proyeksi katalog
      description: |
        Proyeksi ringan seluruh katalog produk aktif, dipakai FE untuk
        `ProductRepository.getAll()`. Cocok untuk dataset kecil; untuk dataset
        besar gunakan `/api/v1/products` dengan pagination.
      responses:
        '200':
          $ref: '#/components/responses/CatalogProductArray'
        '304':
          $ref: '#/components/responses/NotModified'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: Daftar produk (filter, sort, pencarian, pagination keyset)
      description: |
        Hasil dipaginasi dengan **keyset cursor**. `cursor` bersifat opaque:
        kirim kembali nilai dari respons sebelumnya tanpa menafsirkannya.
        Cursor yang `sort`-nya tidak cocok dengan permintaan ditolak dengan
        `400 invalid_cursor`.
      parameters:
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/Brand'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/IncludeInactive'
      responses:
        '200':
          description: Satu halaman produk
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
              examples:
                Halaman:
                  value:
                    products:
                      - id: 018f2c6e-1f3a-7b2c-9d4e-5f60718293a4
                        name: Sharp 24 Inch LED TV
                        slug: sharp-24-inch-led-tv
                        price: 1500000
                        category: television
                        brand: sharp
                        thumbnail: assets/images/products/television/sharp-24.jpg
                        rating: { rate: 4.5, count: 12 }
                        isActive: true
                        createdAt: '2026-10-01T03:00:00.000Z'
                    hasMore: true
                    cursor: eyJzIjoiZGVmYXVsdCIsImMiOiIyMDI2LTEwLTAxVDAzOjAwOjAwWiIsImkiOiIwMThmLi4uIn0
                HalamanTerakhir:
                  value:
                    products: []
                    hasMore: false
                    cursor: null
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'
    post:
      tags: [Products]
      operationId: createProduct
      summary: Buat produk
      description: |
        Hanya admin. `id` tidak dikirim; id selalu dibuat server. `category`
        wajib menunjuk kategori yang sudah ada, `brand` opsional. Referensi
        divalidasi di dalam transaksi yang sama dengan penyimpanannya, sehingga
        produk tidak pernah tersimpan dengan referensi yang menggantung.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Produk dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/products/{id}:
    get:
      tags: [Products]
      operationId: getProduct
      summary: Produk lengkap
      description: |
        Dipakai halaman detail dan form edit admin. `id` berupa UUID canonical;
        id legacy Firestore diterima **hanya sebagai fallback baca**: UUID
        dicoba lebih dulu, dan bila tidak ditemukan server mencari lewat
        `legacy_id` sehingga URL lama tetap hidup. Respons selalu memuat `id`
        canonical UUID — `legacy_id` tidak pernah muncul di DTO. Setiap
        pemakaian fallback dicatat di log untuk menentukan kapan fallback
        boleh dihapus.
      parameters:
        - $ref: '#/components/parameters/PathProductID'
      responses:
        '200':
          description: Produk lengkap
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              examples:
                Produk:
                  value:
                    id: 018f2c6e-1f3a-7b2c-9d4e-5f60718293a4
                    name: Sharp 24 Inch LED TV
                    slug: sharp-24-inch-led-tv
                    price: 1500000
                    description: Televisi LED 24 inci.
                    category: television
                    brand: sharp
                    images:
                      - key: assets/images/products/television/sharp-24.jpg
                        fileId: 65a1b2c3d4e5f6a7b8c9d0e1
                      - key: assets/images/products/television/sharp-24-side.jpg
                        fileId: 65a1b2c3d4e5f6a7b8c9d0e2
                    rating: { rate: 4.5, count: 12 }
                    isActive: true
                    createdAt: '2026-10-01T03:00:00.000Z'
                    updatedAt: '2026-10-01T03:00:00.000Z'
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'
    patch:
      tags: [Products]
      operationId: updateProduct
      summary: Ubah produk
      description: |
        Hanya admin. Field yang tidak dikirim tidak diubah. `images`
        menggantikan seluruh daftar gambar (`[]` mengosongkan). `id` wajib UUID
        canonical; id legacy ditolak.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PathUUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Produk setelah diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'
    delete:
      tags: [Products]
      operationId: deleteProduct
      summary: Hapus produk
      description: |
        Hanya admin. `id` wajib UUID canonical. Penghapusan berkas gambar di
        provider dilakukan server-side setelah transaksi sukses (Fase 5).
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PathUUID'
      responses:
        '204':
          description: Produk dihapus
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: Daftar kategori
      responses:
        '200':
          description: Seluruh kategori
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '304':
          $ref: '#/components/responses/NotModified'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'
    post:
      tags: [Categories]
      operationId: createCategory
      summary: Buat kategori
      description: |
        Hanya admin. `slug` bila kosong diturunkan dari `name`; slug yang sudah
        dipakai menghasilkan `409 conflict`.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Kategori dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/categories/{id}:
    get:
      tags: [Categories]
      operationId: getCategory
      summary: Satu kategori
      parameters:
        - $ref: '#/components/parameters/PathUUID'
      responses:
        '200':
          description: Kategori
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'
    patch:
      tags: [Categories]
      operationId: updateCategory
      summary: Ubah kategori
      description: Hanya admin. Field yang tidak dikirim tidak diubah.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PathUUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Kategori setelah diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'
    delete:
      tags: [Categories]
      operationId: deleteCategory
      summary: Hapus kategori
      description: |
        Hanya admin. Ditolak `409 conflict` bila masih ada produk yang memakai
        kategori ini (FK RESTRICT).
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PathUUID'
      responses:
        '204':
          description: Kategori dihapus
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/brands:
    get:
      tags: [Brands]
      operationId: listBrands
      summary: Daftar brand
      responses:
        '200':
          description: Seluruh brand
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Brand'
        '304':
          $ref: '#/components/responses/NotModified'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'
    post:
      tags: [Brands]
      operationId: createBrand
      summary: Buat brand
      description: |
        Hanya admin. `slug` bila kosong diturunkan dari `name`; slug yang sudah
        dipakai menghasilkan `409 conflict`.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBrandRequest'
      responses:
        '201':
          description: Brand dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/brands/{id}:
    get:
      tags: [Brands]
      operationId: getBrand
      summary: Satu brand
      parameters:
        - $ref: '#/components/parameters/PathUUID'
      responses:
        '200':
          description: Brand
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'
    patch:
      tags: [Brands]
      operationId: updateBrand
      summary: Ubah brand
      description: Hanya admin. Field yang tidak dikirim tidak diubah.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PathUUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBrandRequest'
      responses:
        '200':
          description: Brand setelah diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'
    delete:
      tags: [Brands]
      operationId: deleteBrand
      summary: Hapus brand
      description: |
        Hanya admin. Ditolak `409 conflict` bila masih ada produk yang memakai
        brand ini (FK RESTRICT).
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PathUUID'
      responses:
        '204':
          description: Brand dihapus
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Masuk sebagai admin
      description: |
        Memverifikasi email + password dan membuat sesi. Token sesi dikirim
        lewat cookie `elvan_session` (HttpOnly), **tidak** di body. Percobaan
        dibatasi per IP (`429 rate_limited`); kredensial salah selalu memakai
        delay konstan dan mengembalikan `401 unauthorized` yang seragam.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil; cookie sesi di-set
          headers:
            Set-Cookie:
              description: Cookie sesi HttpOnly (`elvan_session`).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Keluar
      description: |
        Mencabut sesi saat ini dan menghapus cookie. Idempoten: memanggilnya
        tanpa sesi tetap mengembalikan `204`.
      security: []
      responses:
        '204':
          description: Sesi dicabut (bila ada); cookie dihapus
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentAdmin
      summary: Admin dari sesi saat ini
      description: |
        Mengembalikan admin yang sedang login. Dipakai FE untuk memutuskan
        tampilan admin. Sesi tidak valid/kedaluwarsa menghasilkan `401` dan
        cookie dibersihkan.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Admin saat ini
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/media/signature:
    get:
      tags: [Media]
      operationId: issueUploadSignature
      summary: Tanda tangan upload ImageKit
      description: |
        Hanya admin. Mengembalikan `{ token, expire, signature }` (kontrak sama
        persis dengan Worker lama: `signature = HMAC-SHA1(privateKey, token +
        expire)`). Browser memakai nilai ini untuk mengunggah **langsung** ke
        ImageKit; berkas tidak pernah melewati server. Bila modul media tidak
        dikonfigurasi (private key kosong), endpoint mengembalikan `404`.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Tanda tangan upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSignature'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/media/files:
    delete:
      tags: [Media]
      operationId: deleteMediaFiles
      summary: Hapus berkas gambar (transisi)
      description: |
        Hanya admin. Menghapus berkas berdasarkan `fileId` di provider. Endpoint
        ini dipertahankan sementara untuk kompatibilitas FE selama transisi ke
        pembersihan server-side (penghapusan otomatis dilakukan server saat
        produk dihapus atau gambar dilepas); akan dihapus setelah FE berhenti
        memanggilnya.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteFilesRequest'
      responses:
        '200':
          description: Hasil penghapusan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

components:
  schemas:
    Rating:
      type: object
      required: [rate, count]
      properties:
        rate:
          type: number
          format: double
          minimum: 0
          maximum: 5
          description: Nilai rating rata-rata.
        count:
          type: integer
          minimum: 0
          description: Jumlah penilai.

    Image:
      type: object
      required: [key, fileId]
      properties:
        key:
          type: string
          description: Relative key tanpa slash di depan, mis. `assets/images/products/television/x.jpg`.
        fileId:
          type: string
          description: |-
            Id berkas di provider (untuk penghapusan server-side). String
            kosong untuk gambar lama tanpa file id.
          example: 65a1b2c3d4e5f6a7b8c9d0e1

    CatalogProduct:
      type: object
      description: Proyeksi ringan untuk listing (fe `CatalogProduct`).
      required: [id, name, slug, price, category, brand, thumbnail, rating, isActive, createdAt]
      properties:
        id:
          type: string
          description: Id opaque yang dibuat server.
        name: { type: string }
        slug: { type: string }
        price:
          type: integer
          format: int64
          minimum: 0
          description: Satuan terkecil mata uang (Rupiah, bilangan bulat).
        category:
          type: string
          description: Slug kategori.
        brand:
          type: string
          description: Slug brand; string kosong bila produk tidak punya brand.
        thumbnail:
          type: string
          description: Relative key gambar posisi 0; string kosong bila tidak ada gambar.
        rating:
          $ref: '#/components/schemas/Rating'
        isActive: { type: boolean }
        createdAt:
          type: string
          format: date-time

    Product:
      type: object
      description: Produk lengkap (halaman detail/edit).
      required: [id, name, slug, price, description, category, brand, images, rating, isActive, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        price:
          type: integer
          format: int64
          minimum: 0
        description: { type: string }
        category:
          type: string
          description: Slug kategori.
        brand:
          type: string
          description: Slug brand; string kosong bila tidak ada.
        images:
          type: array
          description: Terurut; index 0 adalah thumbnail.
          items:
            $ref: '#/components/schemas/Image'
        rating:
          $ref: '#/components/schemas/Rating'
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProductList:
      type: object
      description: Satu halaman daftar produk (fe `ProductListResult`).
      required: [products, hasMore, cursor]
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/CatalogProduct'
        hasMore:
          type: boolean
          description: True bila masih ada halaman berikutnya.
        cursor:
          type: [string, 'null']
          description: |-
            Token opaque untuk halaman berikutnya; `null` bila tidak ada.
            Kirim kembali apa adanya sebagai parameter `cursor`.

    Category:
      type: object
      required: [id, name, slug, description, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Brand:
      type: object
      required: [id, name, slug, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Admin:
      type: object
      required: [id, email, createdAt]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        createdAt: { type: string, format: date-time }

    Session:
      type: object
      description: Hasil login; token dikirim lewat cookie (lihat `Set-Cookie`).
      required: [admin, expiresAt]
      properties:
        admin:
          $ref: '#/components/schemas/Admin'
        expiresAt:
          type: string
          format: date-time

    UploadSignature:
      type: object
      description: |
        Tanda tangan upload ImageKit; diteruskan apa adanya ke SDK/HTTP ImageKit.
      required: [token, expire, signature]
      properties:
        token: { type: string }
        expire:
          type: integer
          format: int64
          description: Unix time kedaluwarsa (30 menit sejak diterbitkan).
        signature:
          type: string
          description: HMAC-SHA1 hex dari `token + expire` memakai private key server.

    DeleteFilesRequest:
      type: object
      required: [fileIds]
      properties:
        fileIds:
          type: array
          minItems: 1
          items: { type: string }

    DeleteResult:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: integer
          description: Jumlah berkas yang berhasil dihapus.
        failed:
          type: array
          description: fileId yang gagal dihapus (bila ada).
          items: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1

    ImageInput:
      type: object
      description: |-
        Gambar yang sudah diunggah ke provider (upload tetap langsung dari
        browser). `fileId` kosong untuk aset lama tanpa id provider.
      required: [key]
      properties:
        key: { type: string }
        fileId: { type: string }

    CreateProductRequest:
      type: object
      description: |-
        `id` tidak dikirim; id selalu dibuat server. `category`/`brand` berupa
        slug dan harus sudah ada.
      required: [name, slug, price, category]
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string }
        price:
          type: integer
          format: int64
          minimum: 0
        description: { type: string }
        category:
          type: string
          description: Slug kategori; wajib ada.
        brand:
          type: string
          description: Slug brand; kosong berarti tanpa brand.
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageInput'
        rating:
          $ref: '#/components/schemas/Rating'
        isActive:
          type: boolean
          default: true

    UpdateProductRequest:
      type: object
      description: |-
        Semua field opsional; yang tidak dikirim tidak diubah. `images`
        menggantikan seluruh gambar (`[]` mengosongkan).
      properties:
        name: { type: string }
        slug: { type: string }
        price:
          type: integer
          format: int64
          minimum: 0
        description: { type: string }
        category: { type: string }
        brand: { type: string }
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageInput'
        rating:
          $ref: '#/components/schemas/Rating'
        isActive: { type: boolean }

    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        slug:
          type: string
          description: Bila kosong, server menurunkannya dari `name`.
        description: { type: string }

    UpdateCategoryRequest:
      type: object
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string }

    CreateBrandRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        slug:
          type: string
          description: Bila kosong, server menurunkannya dari `name`.

    UpdateBrandRequest:
      type: object
      properties:
        name: { type: string }
        slug: { type: string }

    Error:
      type: object
      description: Envelope error untuk seluruh endpoint.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Kode error stabil yang bisa dicek program.
              enum:
                - validation_failed
                - invalid_cursor
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - rate_limited
                - timeout
                - internal
            message:
              type: string
              description: Pesan yang aman ditampilkan ke pengguna.
            details:
              type: array
              description: Rincian per field; hanya untuk error validasi.
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string }
                  message: { type: string }

  parameters:
    PathProductID:
      name: id
      in: path
      required: true
      description: |
        UUID produk canonical, atau id legacy Firestore (fallback **read-only**
        selama masa migrasi; hanya untuk GET). Respons selalu memuat `id`
        canonical UUID.
      schema:
        type: string

    PathUUID:
      name: id
      in: path
      required: true
      description: |
        Hanya UUID canonical. Id legacy Firestore **ditolak** `400
        validation_failed` (field `id`) — berlaku untuk kategori/brand dan
        untuk operasi tulis produk yang menyertakan `{id}` (PATCH/DELETE).
        `POST /products` tidak menerima `id`; id produk selalu dibuat server.
        Semantik legacy id: lihat issue #6.
      schema:
        type: string
        format: uuid

    Category:
      name: category
      in: query
      description: Filter berdasarkan slug kategori.
      schema:
        type: string
      example: television

    Brand:
      name: brand
      in: query
      description: Filter berdasarkan slug brand.
      schema:
        type: string
      example: sharp

    Search:
      name: search
      in: query
      description: Pencarian substring pada nama produk.
      schema:
        type: string
        maxLength: 200
      example: led 24

    Sort:
      name: sort
      in: query
      description: Urutan hasil. `default` = terbaru dulu.
      schema:
        type: string
        enum: [default, price-asc, price-desc, rating-desc]
        default: default

    Limit:
      name: limit
      in: query
      description: Jumlah maksimum item per halaman (dibatasi 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 24

    Cursor:
      name: cursor
      in: query
      description: |-
        Token opaque dari respons sebelumnya. Jangan di-parse atau dibuat
        sendiri. Harus berasal dari `sort` yang sama.
      schema:
        type: string

    IncludeInactive:
      name: includeInactive
      in: query
      description: |-
        Menyertakan produk nonaktif. Hanya dihormati untuk admin
        terautentikasi; diabaikan untuk pengunjung publik (selalu hanya produk
        aktif).
      schema:
        type: boolean
        default: false

  headers:
    ETag:
      description: Validator konten respons. Kirim sebagai `If-None-Match` untuk mendapat `304`.
      schema:
        type: string
      example: '"4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945"'
    CacheControl:
      schema:
        type: string
      example: public, max-age=60
    RequestId:
      description: Id request untuk penelusuran log.
      schema:
        type: string

  responses:
    CatalogProductArray:
      description: Array proyeksi katalog
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CatalogProduct'

    NotModified:
      description: Konten tidak berubah (If-None-Match cocok dengan ETag saat ini).
      headers:
        ETag:
          $ref: '#/components/headers/ETag'

    BadRequest:
      description: |-
        Permintaan tidak valid. `code` bernilai `validation_failed` (mis. `sort`
        tidak dikenal, `limit` bukan bilangan) atau `invalid_cursor` (cursor
        rusak atau berasal dari `sort` lain).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            Validasi:
              value:
                error:
                  code: validation_failed
                  message: Data tidak valid
                  details:
                    - field: sort
                      message: 'nilai tidak didukung: bogus'
            Cursor:
              value:
                error:
                  code: invalid_cursor
                  message: Cursor tidak valid
                  details:
                    - field: cursor
                      message: cursor tidak valid

    NotFound:
      description: Data tidak ditemukan.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: Data tidak ditemukan

    Unauthorized:
      description: Belum login, atau sesi tidak valid/kedaluwarsa.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthorized
              message: Belum terautentikasi

    Forbidden:
      description: |-
        Origin permintaan tidak diizinkan (guard CSRF), atau aksi tidak
        diizinkan untuk sesi ini.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: forbidden
              message: Tidak diizinkan

    Conflict:
      description: |-
        Konflik data: slug duplikat, atau kategori/brand yang masih dipakai
        produk dihapus (RESTRICT).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: conflict
              message: Konflik data

    RateLimited:
      description: Terlalu banyak percobaan login dari IP ini.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: rate_limited
              message: Terlalu banyak percobaan; coba lagi nanti

    InternalError:
      description: |-
        Kesalahan internal. Detail sebenarnya hanya dicatat di log; klien tidak
        pernah menerima pesan internal.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: internal
              message: Terjadi kesalahan internal

    Timeout:
      description: |-
        Permintaan melewati batas waktu (`REQUEST_TIMEOUT`, default 30 detik)
        atau query melewati `DB_STATEMENT_TIMEOUT`. Bukan kegagalan data:
        klien boleh mencoba ulang.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: timeout
              message: Permintaan memakan waktu terlalu lama; coba lagi

  # Sesi dibawa cookie HttpOnly. `bearerTransport` (Authorization: Bearer)
  # belum dibangun; lihat ARCHITECTURE §10.
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: elvan_session
      description: Cookie sesi HttpOnly yang di-set oleh `POST /auth/login`.
